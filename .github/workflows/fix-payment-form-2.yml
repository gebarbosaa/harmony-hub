name: Fix payment form 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused cards query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/despesas.tsx')
          s=p.read_text()
          s=s.replace('const cards=useHouseholdTable<Card>("cards","id,name,brand,last4,credit_limit,close_day,due_day,household_id","name");','')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/despesas.tsx
          git diff --cached --quiet || git commit -m 'fix: remover consulta desnecessária de cartões'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-payment-form-2.yml
          git commit -m 'chore: remover workflow temporário'
          git push