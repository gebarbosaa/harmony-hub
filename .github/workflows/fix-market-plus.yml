name: Fix market add item button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix button behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/mercado.tsx')
          s=p.read_text()
          old='  <PageHeader title="MERCADO" subtitle="PLANEJE, COMPRE AO VIVO E CONSULTE SUAS COMPRAS." action={<button onClick={()=>setNewList("")} className="gradient-primary flex h-11 w-11 items-center justify-center rounded-full text-primary-foreground"><Plus className="h-5 w-5"/></button>}/>'
          new='  <PageHeader title="MERCADO" subtitle="PLANEJE, COMPRE AO VIVO E CONSULTE SUAS COMPRAS." />'
          if old in s:
              s=s.replace(old,new,1)
          marker='<Panel title={`ITENS DA LISTA — ${current.name}`}><div className="space-y-2">'
          replacement='<Panel title={`ITENS DA LISTA — ${current.name}`}><div className="mb-3 flex items-center justify-between"><p className="text-xs text-muted-foreground">ADICIONE ITENS À LISTA SELECIONADA</p><button type="button" onClick={()=>document.getElementById("novo-item-mercado")?.focus()} aria-label="ADICIONAR ITEM" title="ADICIONAR ITEM" className="gradient-primary flex h-10 w-10 items-center justify-center rounded-full text-primary-foreground"><Plus className="h-5 w-5"/></button></div><div className="space-y-2">'
          if marker in s and 'ADICIONE ITENS À LISTA SELECIONADA' not in s:
              s=s.replace(marker,replacement,1)
          needle='<input value={product} onChange={e=>setProduct(e.target.value)} placeholder="PRODUTO"'
          if needle in s and 'id="novo-item-mercado"' not in s:
              s=s.replace(needle,'<input id="novo-item-mercado" value={product} onChange={e=>setProduct(e.target.value)} placeholder="PRODUTO"',1)
          p.write_text(s)
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mercado.tsx
          git rm .github/workflows/fix-market-plus.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: move market plus to selected list"
          git push